org:
  projectfile:
    artifacts:
      go-binary:
        command: pf-cli
        module: projectfile.org/projectfile/cli/v3/cmd/pf-cli
        executable: dist/pf-cli
        subcommands: [add, cache, cache purge, cache refresh, cache status, cache warm, completion, convert, del, get, includes, includes pin, init, optimize, set, setup, validate]
        kind: binary
        path: dist/pf-cli
        operating-system: [linux, darwin]
        exclude:
          - {os: darwin, arch: riscv64}
    architecture:
      - amd64
      - arm64
      - riscv64
    operating-system:
      - linux
    ci:
      nodes:
        binaries-are-built:
          matrix: {artifact: go-binary}
        gsa:
          matrix: {artifact: go-binary}
        # Torrenting waits on the signature: a signed artifact is bundled with its .asc before hashing.
        # NO matrix: one torrent carries every cell, so this node runs once and takes them all.
        binaries-are-torrented:
          needs:
            binaries-are-signed: true
            binaries-are-ok: false
        image-is-built:
          needs:
            schema-fetched: true
        schema-fetched:
          needs:
            fetch-schema: true
        source-is-tested:
          needs:
            schema-fetched: true
        source-passes-lint:
          needs:
            schema-fetched: true
        # Release restores dist/ from the torrent node alone — the only one holding both the .asc and the .torrent.
        release-is-published:
          needs:
            binaries-are-signed: false
      tools:
        fetch-schema:
          artifact: internal/validate/embedded
          description: Clone or update projectfile/specification, then install the v1 schema for embedding
          run: .scripts/fetch-schema.sh
    ignores:
      git:
        include:
          - _specification
    status: maintained
    release:
      tag-prefix: v
    tests:
      # Narrowed from the fleet 90: Go does not instrument package-level var initialisers, so every mutant
      # inside a `var xxxCmd = &cobra.Command{…}` literal is permanently NOT COVERED and caps mutant
      # coverage at ~87%. Efficacy keeps its own 90% gate under org.projectfile.tests.mutation.
      coverage:
        minimum: 86
repositories:
