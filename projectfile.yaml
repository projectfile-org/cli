---
# SPDX-FileCopyrightText: 2026 Damián Búho <damian.buho@proton.me>
#
# SPDX-License-Identifier: MIT
$schema: https://projectfile.org/schema/v1.json
copyright:
  year: 2026
identity:
  created: "2026-07-07"
  name: cli
  summary:
    en: pf-cli is the CLI for reading, writing and validating projectfiles
    es: pf-cli es la CLI para leer, escribir y validar projectfiles
    uk: pf-cli — CLI для читання, запису та валідації projectfile-файлів
  title: Projectfile CLI
  description:
    en: 'pf-cli is the command-line front end for the projectfile: it reads, writes and validates fields, resolves remote includes, and generates derived artifacts. It embeds the v1 JSON Schema for offline validation and is the canonical tool for editing projectfiles locally and in CI.'
    es: 'pf-cli es la interfaz de línea de órdenes del projectfile: lee, escribe y valida campos, resuelve includes remotos y genera artefactos derivados. Embebe el esquema JSON v1 para validación sin conexión y es la herramienta canónica para editar projectfiles localmente y en CI.'
    uk: 'pf-cli — командний інтерфейс projectfile: читає, записує та валідує поля, розвʼязує віддалені includes і генерує похідні артефакти. Містить вбудовану JSON-схему v1 для офлайн-валідації та є канонічним інструментом редагування projectfile-файлів локально й у CI.'
includes:
  - .makefile/b19/ci.yaml
  - .makefile/b19/images/go.yaml
  - .makefile/b19/images/ubuntu.yaml
  - .makefile/library/languages/go.yaml
  - .makefile/library/traits/go-binary.yaml
  - https://kiota.ch/damian-buho/metadata/raw/branch/main/include.yaml
  - https://kiota.ch/projectfile/metadata/raw/branch/main/include.yaml
kind: SoftwareSourceCode
org:
  projectfile:
    artifacts:
      go-binary:
        command: pf-cli
        kind: binary
        path: dist/pf-cli
    build:
      args:
        GOPROXY: ""
    ci:
      env:
        GOPROXY: https://kiota.ch/api/packages/projectfile/go,direct
      forgejo:
        credentials:
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      nodes:
        binaries-built:
          matrix:
            axes:
              GOARCH:
                - amd64
                - arm64
                - riscv64
              GOOS:
                - linux
                - darwin
            exclude:
              - GOARCH: riscv64
                GOOS: darwin
        gsa:
          matrix:
            axes:
              GOARCH:
                - amd64
                - arm64
                - riscv64
              GOOS:
                - linux
                - darwin
            exclude:
              - GOARCH: riscv64
                GOOS: darwin
        binaries-released:
          matrix:
            axes:
              GOARCH:
                - amd64
                - arm64
                - riscv64
              GOOS:
                - linux
                - darwin
            exclude:
              - GOARCH: riscv64
                GOOS: darwin
        image-is-built:
          needs:
            schema-fetched: true
        schema-fetched:
          needs:
            fetch-schema: true
        source-is-tested:
          needs:
            schema-fetched: true
        source-passes-lint:
          needs:
            schema-fetched: true
      tools:
        fetch-schema:
          artifact: internal/validate/embedded
          description: Clone or update projectfile/specification, then install the v1 schema for embedding
          run: .scripts/fetch-schema.sh
    ignores:
      git:
        include:
          - _specification
          - internal/validate/embedded/v1.json
          - internal/validate/embedded/v1.json.license
    readme:
      usage:
        - commands:
            - pf-cli get identity.name
            - pf-cli get 'links[type=source-code].url'
            - pf-cli set org.projectfile.status maintained
            - pf-cli validate
          name: binary
          prefix: 'Read and write projectfile fields from the shell:'
    status: maintained
repositories:
  - issues: true
    role: mirror
    type: git
    url: ssh://git@codeberg.org/projectfile/cli.git
  - role: mirror
    type: git
    url: git@github.com:damian-buho/projectfile-cli.git
  - branch: main
    role: origin
    type: git
    url: ssh://git@kiota.ch/projectfile/cli.git
links:
  - label:
      en: Projectfile CLI on kiota.ch
      es: Projectfile CLI en kiota.ch
      uk: Projectfile CLI на kiota.ch
    preferred: true
    type: source-code
    url: https://kiota.ch/projectfile/cli
keywords:
  - pf-cli
  - projectfile
  - cli
  - yaml
  - validate
  - go
technologies:
  - go
license:
  covers: project
  spdx: "MIT"
