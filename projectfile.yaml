org:
  projectfile:
    artifacts:
      go-binary:
        command: pf-cli
        kind: binary
        path: dist/pf-cli
    architecture:
      - amd64
      - arm64
      - riscv64
    operating-system:
      - linux
    ci:
      nodes:
        binaries-are-built:
          matrix:
            axes:
              GOARCH:
                - amd64
                - arm64
                - riscv64
              GOOS:
                - linux
                - darwin
            exclude:
              - GOARCH: riscv64
                GOOS: darwin
        gsa:
          matrix:
            axes:
              GOARCH:
                - amd64
                - arm64
                - riscv64
              GOOS:
                - linux
                - darwin
            exclude:
              - GOARCH: riscv64
                GOOS: darwin
        binaries-are-signed:
          matrix:
            axes:
              GOARCH:
                - amd64
                - arm64
                - riscv64
              GOOS:
                - linux
                - darwin
            exclude:
              - GOARCH: riscv64
                GOOS: darwin
        # Torrenting waits on the signature: a signed artifact is bundled with its .asc before hashing.
        # NO matrix: one torrent carries every cell, so this node runs once and takes them all.
        binaries-are-torrented:
          needs:
            binaries-are-signed: true
            binaries-are-ok: false
        # Release restores dist/ from the torrent node alone — the only one holding both the .asc and the .torrent.
        binaries-are-released:
          needs:
            binaries-are-signed: false
          matrix:
            axes:
              GOARCH:
                - amd64
                - arm64
                - riscv64
              GOOS:
                - linux
                - darwin
            exclude:
              - GOARCH: riscv64
                GOOS: darwin
        image-is-built:
          needs:
            schema-fetched: true
        schema-fetched:
          needs:
            fetch-schema: true
        source-is-tested:
          needs:
            schema-fetched: true
        source-passes-lint:
          needs:
            schema-fetched: true
      tools:
        fetch-schema:
          artifact: internal/validate/embedded
          description: Clone or update projectfile/specification, then install the v1 schema for embedding
          run: .scripts/fetch-schema.sh
    ignores:
      git:
        include:
          - _specification
          - internal/validate/embedded/v1.json
          - internal/validate/embedded/v1.json.license
    readme:
      usage:
        - commands:
            - pf-cli get identity.name
            - pf-cli get 'links[type=source-code].url'
            - pf-cli set org.projectfile.status maintained
            - pf-cli validate
          name: binary
          prefix: 'Read and write projectfile fields from the shell:'
    status: maintained
